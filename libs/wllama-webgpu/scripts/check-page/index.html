<!doctype html>
<meta charset="utf-8" />
<title>engine check</title>
<script type="module">
  // Thin RPC bridge: the check script drives window.__si over the DevTools Protocol. The engine runs in the Worker.
  const worker = new Worker("/worker.js", { type: "module" });
  const pending = new Map();
  let nextId = 1;
  const state = { ready: true, progress: null };
  worker.onmessage = ({ data }) => {
    if (data.type === "progress") state.progress = data;
    else if (data.type === "reply") {
      pending.get(data.id)?.(data);
      pending.delete(data.id);
    }
  };
  worker.onerror = (event) => {
    for (const resolve of pending.values()) resolve({ ok: false, error: `worker error: ${event.message}` });
    pending.clear();
  };
  const call = (message) =>
    new Promise((resolve) => {
      const id = nextId++;
      pending.set(id, resolve);
      worker.postMessage({ ...message, id });
    });
  window.__si = {
    get ready() {
      return state.ready;
    },
    get progress() {
      return state.progress;
    },
    isolated: () => self.crossOriginIsolated,
    call,
  };
</script>
